[package]
name = "maia-studio"
version = "0.1.0"
description = "Maia3 79M human chess analysis studio"
authors = ["Maia Studio contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "maia_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time"] }
